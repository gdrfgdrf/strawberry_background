[package]
name = "strawberry_background"
version = "0.1.0"
edition = "2024"

[lib]
name = "strawberry_background"
path = "src/lib.rs"

[workspace]
members = [
    "strawberry_macros",
]

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "blocking", "stream"] }
tokio = { version = "1.49.0", features = ["full"] }
thiserror = "2.0.18"
async-trait = "0.1.89"
percent-encoding = "2.3.2"
reqwest_cookie_store = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"
moka = { version = "0.12.13", features = ["future"] }
dashmap = "6.1.0"
rkyv = { version = "0.8.14", features = ["std", "bytecheck"] }
bytecheck = "0.8.2"
uuid = { version = "1.20.0", features = ["v4"] }
futures-util = "0.3.31"
bytes = "1.11.0"
tokio-util = { version = "0.7.18", features = ["compat"] }
pin-project = "1.1.11"
lazy_static = "1.5.0"
rkv = "0.20.0"
parking_lot = "0.12.5"
strawberry_macros = { path = "strawberry_macros" }
seqlock = "0.2.0"
rand = "0.10.1"
rodio = "0.22.2"
futures = "0.3.31"
tokio-stream = { version = "0.1.18", features = ["sync"] }
rodio_tap = { version = "0.2.0", features = ["visualizer", "async"] }
rustfft = "6.4.1"
num-complex = "0.4.6"
arrayvec = "0.7.6"
realfft = "3.5.0"
simple-eq = { git = "https://github.com/m-hilgendorf/simple-eq.git" }
aes = "0.8.4"
base64 = "0.23.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cpal = "0.17"
tracing = "0.1.44"
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "entity-registry"] }
sea-orm-migration = { version = "2.0.0-rc.41", features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-chrono"] }

[dev-dependencies]
tokio-test = "*"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(target_os = "android")'.dependencies]
android-media = "0.1.1"
jni = "0.21"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
audio-recorder-rs = { git = "https://github.com/gdrfgdrf/audio-recorder-rs" }
crossbeam-channel = "0.5.15"